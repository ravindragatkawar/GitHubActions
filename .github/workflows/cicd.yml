# Name of the workflow
name: CICD

# Events that triggers the workflow
on:
  push

# Jobs
jobs:

  # Job
  build:
    # Runner that executes the job
    runs-on: ubuntu-latest

    # Steps
    steps:
      # Action
      - name: Checkout repository
        uses: actions/checkout@v7

      # Action with input parameters
      - name: Setup up python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15' 

      # Shell command execution
      - name: Build package
        run: python main.py

      # Single command
      - name: Single command
        run: echo "Single command"

      # Multiple commands
      - name: Multiple commands, multiline script
        run: |
          echo "Multiple commands,"
          echo "multiline script"
