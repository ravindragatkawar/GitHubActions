# Name of the workflow
run-name: CICD started by ${{ github.actor }}

on:
  push:
    branches:
      - main
  workflow_dispatch:
  
jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Build
        run: echo "Build done"
  
  dev:
    needs: build

    runs-on: ubuntu-latest
    
    environment:
      name: dev

    steps:
      - name: Dev
        run: echo "${{ vars.test }}"
  
  prod:
    needs: build

    runs-on: ubuntu-latest

    environment:
      name: prod

    steps:
      - name: Prod
        run: echo "${{ vars.test }}"
      